global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      track_unknown_space: true
      # Match the local envelope; Hybrid-A* checks it at each heading.
      footprint: "[[0.83, 0.37], [-0.83, 0.37], [-0.83, -0.37], [0.83, -0.37]]"
      footprint_padding: 0.03
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /rtabmap/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false # Consume RTAB-Map's full OccupancyGrid updates.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        # Match the local map: steep decay, negligible distant wall costs.
        cost_scaling_factor: 9.5
      always_send_full_costmap: true
