planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [LazyThetaStar]
    LazyThetaStar:
      plugin: nav2_lazy_theta_star_planner::LazyThetaStarPlanner
      turn_penalty_weight: 0.6
      interpolation_step: 0.05
      smoothing_radius: 0.6
      allow_unknown: true
