controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    # FollowPath parameters come from controller_<name>.yaml, chosen by the
    # controller launch argument. Keeping the server and both checkers here
    # means every controller is judged by the same goal and progress rules.
