smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.60, 0.0, 2.40]
    min_velocity: [-0.40, 0.0, -2.40]
    max_accel: [0.60, 0.0, 3.60]
    max_decel: [-0.60, 0.0, -3.60]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
