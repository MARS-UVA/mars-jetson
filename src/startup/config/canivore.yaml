# Hardware settings for robot_backend:=canivore (canivore_hardware/CanivoreHardware).
# Wheels and drums: Kraken X60s (device_type talonfx, the default).
# Arms: linear actuators on Talon FXS controllers (device_type talonfxs).
# Everything is on the CANivore, driven with Phoenix 6.
# This is the only file to edit once the real CAN IDs, gear ratios, etc. are known.
# Every parameter is described in src/canivore_hardware/README.md.
#
# can_id: -1 means "not connected": that joint echoes its command back as its state, so the
# controllers run without the motor. Give one joint a real ID at a time when bringing up.
#
# Units: positions in radians, velocities in rad/s, currents in amps. gear_ratio is motor
# rotations per joint rotation. kP/kS/kV are Phoenix Slot0 gains in volts per (joint
# rotation/s), because the plugin sets SensorToMechanismRatio = gear_ratio.
# With kP, kS and kV all 0 a motor will not move; a starting kV is roughly
# 12 / (max joint speed in rotations/s).

canbus: "*"              # CANivore name or serial number; "*" = any CANivore found
feed_timeout_ms: 100     # motors disable themselves if commands stop for this long
enable_foc: false        # needs Phoenix Pro licenses; leave false until licensed

joints:
  # ---- Drivetrain: max_velocity matches the URDF limit (10 rad/s) ----
  front_left_wheel_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: brake
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0
  front_right_wheel_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: brake
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0
  rear_left_wheel_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: brake
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0
  rear_right_wheel_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: brake
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0

  # ---- Arms: linear actuators on Talon FXS (brushed DC) ----
  # Open loop like the old ESP32: a command is a fraction of max_velocity, so with
  # max_velocity 1.0 a command of 1.0 (what dig/dump send) means full power.
  #
  # Position sensor: set feedback_sensor to what the actuator has (analog = potentiometer
  # into the FXS analog input, quadrature = encoder, pulsewidth = absolute encoder). Then read
  # the raw value in Phoenix Tuner X with the actuator fully retracted and fully extended
  # (volts for analog, rotations for the encoders) and fill in sensor_retracted and
  # sensor_extended. /position then reports the measured extension, like the old robot.
  # Until then, position is estimated from commands and the actuator's own limit switches
  # must stop it at the ends.
  #
  # feedback_* map arm angle <-> 0..1 extension (same as the sim's actuator_feedback.yaml).
  front_arm_joint:
    device_type: talonfxs
    can_id: -1
    brushed_wiring: AB      # Talon FXS output leads the actuator is wired to: AB, AC or BC
    inverted: false
    neutral_mode: brake
    max_velocity: 1.0
    stator_current_limit: 30.0
    supply_current_limit: 20.0
    feedback_sensor: none   # none | analog | quadrature | pulsewidth
    sensor_retracted: null
    sensor_extended: null
    min_position: -1.2
    max_position: 0.2
    feedback_angle_start: -1.2
    feedback_angle_end: 0.2
    feedback_output_start: 1.0
    feedback_output_end: 0.0
  rear_arm_joint:
    device_type: talonfxs
    can_id: -1
    brushed_wiring: AB
    inverted: false
    neutral_mode: brake
    max_velocity: 1.0
    stator_current_limit: 30.0
    supply_current_limit: 20.0
    feedback_sensor: none
    sensor_retracted: null
    sensor_extended: null
    min_position: -1.2
    max_position: 0.2
    feedback_angle_start: -1.2
    feedback_angle_end: 0.2
    feedback_output_start: 1.0
    feedback_output_end: 0.0

  # ---- Drums ----
  front_drum_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: coast
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0
  rear_drum_joint:
    can_id: -1
    gear_ratio: 1.0
    inverted: false
    neutral_mode: coast
    max_velocity: 10.0
    stator_current_limit: 40.0
    supply_current_limit: 30.0
    kP: 0.0
    kS: 0.0
    kV: 0.0
