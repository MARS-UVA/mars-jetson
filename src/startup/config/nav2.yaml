# Initial navigation-only configuration for ROS 2 Jazzy.
# RTAB-Map owns map -> odom, odom -> base_link, and /rtabmap/map.
# No AMCL or map_server: confirm /rtabmap/map is nav_msgs/OccupancyGrid.
# /odom is the intended estimator-independent input. nav2.launch.py rewrites
# odom_topic to the selected estimator topic (currently /rtabmap/icp_odom).
# Odometry must contain measured base-frame velocities before navigation tests.
# use_sim_time defaults to false and is rewritten by the optional launch.
#
# Footprint from transformed collision vertices: full wheel/drum rotation and
# arm travel sampled from -1.2..0.2 rad give blue-forward bounds about
# x +/-0.808, y +/-0.356 m. Rounded outward to +/-0.83, +/-0.37 m,
# plus 0.03 m padding. Padded rectangle is 1.72 x 0.80 m.
# Confirm the envelope against the physical robot before hardware use.
#
# Height limits are in the costmap fixed frame, not the camera optical frame.
# Initial flat-ground assumption: ground ~-0.13 m in odom (initial base origin).
# Reject returns below -0.08 m (~5 cm above that ground). Verify this against
# actual TF/clouds; a height cut alone does not segment ground on slopes.
# Local obstacles use the front/rear RGB-D cameras. LiDAR is used for
# ICP odometry and RTAB-Map mapping, not as a required local observation source.

navigation_cloud_filter:
  ros__parameters:
    use_sim_time: false
    input_topic: /unilidar/cloud
    output_topic: /unilidar/navigation_points
    base_frame: base_link
    # Simulation/flat-floor defaults; calibrate these for hardware.
    body_half_length: 0.90
    body_half_width: 0.38
    body_max_height: 0.50
    min_height_in_base: -0.08
    max_height_in_base: 1.45

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odom
    enable_stamped_cmd_vel: false
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: DiffDrive
      time_steps: 56
      model_dt: 0.05 # 2.8-second prediction horizon at 20 Hz.
      batch_size: 1000 # Starting compute budget; profile on the Jetson.
      iteration_count: 1
      vx_max: 0.60
      vx_min: -0.40
      vy_max: 0.0
      wz_max: 2.40
      ax_max: 0.60
      ax_min: -0.60
      ay_max: 0.0
      ay_min: 0.0
      az_max: 3.60
      vx_std: 0.20
      vy_std: 0.0
      wz_std: 0.80
      prune_distance: 2.0 # Covers the 1.68 m forward prediction horizon.
      enforce_path_inversion: true # Follow the planner's forward/reverse cusps.
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      visualize: false
      critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic]
      ObstaclesCritic:
        consider_footprint: true
        # Penalize imminent contact without rewarding broad wall clearance.
        repulsion_weight: 0.0
        collision_margin_distance: 0.05
        critical_weight: 20.0
        collision_cost: 10000.0
      PathAlignCritic:
        use_path_orientations: true
      PathAngleCritic:
        mode: 2 # Follow feasible Hybrid-A* headings, including reverse segments.
        cost_weight: 6.0 # Prioritize correcting heading over forward progress.
        max_angle_to_furthest: 0.35 # Start correcting at ~20 degrees, not 45.
        threshold_to_consider: 0.25
      PathFollowCritic:
        cost_weight: 3.0 # Reduce pressure to advance before heading is aligned.
      GoalAngleCritic:
        cost_weight: 5.0
      # Remaining critic weights use the installed Jazzy plugin defaults.

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 2.0
      footprint: "[[0.83, 0.37], [-0.83, 0.37], [-0.83, -0.37], [0.83, -0.37]]"
      footprint_padding: 0.03
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: -0.10
        z_resolution: 0.10
        z_voxels: 16 # Grid top: 1.50 m; source heights stay inside this grid.
        min_obstacle_height: -0.08
        max_obstacle_height: 1.45
        mark_threshold: 0
        observation_sources: rgbd_blue rgbd_orange
        # Included only with enable_local_lidar:=true. Clouds retain the raw
        # sensor frame and timestamp; Nav2 queues them until odom TF is ready.
        lidar:
          topic: /unilidar/navigation_points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.08
          max_obstacle_height: 1.45
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
        rgbd_blue:
          topic: /rgbd_blue/points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.08
          max_obstacle_height: 1.45
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          observation_persistence: 0.0
          expected_update_rate: 0.5 # Maximum tolerated interval, in seconds.
        rgbd_orange:
          topic: /rgbd_orange/points
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.08
          max_obstacle_height: 1.45
          obstacle_min_range: 0.10
          obstacle_max_range: 2.5
          raytrace_min_range: 0.10
          raytrace_max_range: 3.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # Cover the padded rectangle's circumscribed radius (~0.949 m)
        # so MPPI can use inflation costs to accelerate footprint checks.
        inflation_radius: 1.0
        # Keep nonzero cost at the ~0.949 m circumscribed radius so MPPI
        # can skip full footprint checks when sufficiently far from obstacles.
        # At ~0.95 m from a wall the soft cost is only 1/254. Keep that
        # nonzero threshold for MPPI's optimized footprint collision checks.
        cost_scaling_factor: 9.5
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2
      resolution: 0.05
      update_frequency: 1.0
      publish_frequency: 1.0
      track_unknown_space: true
      # Match the local envelope; Hybrid-A* checks it at each heading.
      footprint: "[[0.83, 0.37], [-0.83, 0.37], [-0.83, -0.37], [0.83, -0.37]]"
      footprint_padding: 0.03
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /rtabmap/map
        map_subscribe_transient_local: true
        subscribe_to_updates: false # Consume RTAB-Map's full OccupancyGrid updates.
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 1.0
        # Match the local map: steep decay, negligible distant wall costs.
        cost_scaling_factor: 9.5
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerHybrid
      tolerance: 0.20
      allow_unknown: true
      downsample_costmap: false
      max_planning_time: 2.0
      motion_model_for_search: REEDS_SHEPP # Forward and reverse maneuvers.
      angle_quantization_bins: 72
      minimum_turning_radius: 0.40 # Initial curved-path radius; tune in simulation.
      analytic_expansion_max_length: 3.0
      cost_penalty: 2.0 # Prefer clearance when choosing the global route.
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 2.40
    min_rotational_vel: 0.10
    rotational_acc_lim: 3.60
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
    wait:
      plugin: nav2_behaviors::Wait

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity: [0.60, 0.0, 2.40]
    min_velocity: [-0.40, 0.0, -2.40]
    max_accel: [0.60, 0.0, 3.60]
    max_decel: [-0.60, 0.0, -3.60]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5
